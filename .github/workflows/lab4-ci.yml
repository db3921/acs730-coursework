name: Lab 4 CI
on:
  push:
    branches: [main]
    paths: ['lab4/**', '.github/workflows/lab4-ci.yml']
  pull_request:
    paths: ['lab4/**', '.github/workflows/lab4-ci.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t lab4:ci lab4

      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 lab4:ci
          sleep 3
          curl --fail http://localhost:8080/health
          docker rm -f app
